version: 1
purpose: >-
  Machine-readable lane router for Agent Brain. Agents read this first to resolve
  brain file, execution ledger, quality gates, and primary skill/agent for a path prefix.
last_updated: 2026-07-18

context_recovery_order:
  - .cursor/brain/lane-router.yaml
  - .cursor/rules/70-execution-constitution.mdc
  - lane-specific brain file (see lanes below)
  - lane-specific ledger file
  - lane-specific ai-context or skill entrypoint

lanes:
  founder_os:
    path_prefixes:
      - .cursor/brain/founder-os-memory/
    brain: .cursor/brain/founder-os-brain.md
    ledger: AI-BOS/tasks.md
    memory: .cursor/brain/founder-os-memory/
    primary_agents:
      - founder-os
      - founder-research
      - founder-marketing
      - founder-sales
      - founder-automation
    primary_skills:
      - founder-os
      - founder-research
      - founder-marketing
      - founder-sales
      - founder-automation
    phase_end_gate_agent: null
    notes: Entry lane for PRJ-STR-FOUNDEROS-001 — strategy orchestrator + I13 specialists, no coding

  marketing_os:
    path_prefixes:
      - .cursor/brain/founder-os-memory/projects/
      - .cursor/skills/marketing-cmo/
      - .cursor/skills/mkt-
      - AI-BOS/.cursor/skills/marketing-cmo/
      - AI-BOS/.cursor/skills/mkt-
    brain: .cursor/brain/founder-os-brain.md
    ledger: AI-BOS/tasks.md
    memory: .cursor/brain/founder-os-memory/projects/<slug>/marketing/
    primary_agents:
      - marketing-cmo
      - founder-marketing
      - mkt-brand-strategist
      - mkt-content-strategist
      - mkt-seo-keyword
      - mkt-analytics
    primary_skills:
      - marketing-cmo
      - founder-marketing
      - mkt-brand-strategist
      - mkt-content-strategist
      - mkt-seo-keyword
      - mkt-analytics
    phase_end_gate_agent: null
    notes: Marketing department entry PRJ-GRO-MKOS-001 — CMO orchestrates; advisory only, no coding

  seo_os:
    path_prefixes:
      - .cursor/brain/founder-os-memory/projects/
      - .cursor/skills/seo-lead/
      - .cursor/skills/mkt-seo-international/
      - .cursor/skills/mkt-seo-automation/
      - .cursor/skills/mkt-seo-algorithm-watch/
      - AI-BOS/.cursor/skills/seo-lead/
    brain: .cursor/brain/founder-os-brain.md
    ledger: AI-BOS/tasks.md
    memory: .cursor/brain/founder-os-memory/projects/<slug>/marketing/seo/
    primary_agents:
      - seo-lead
      - technical-seo
      - on-page-seo
      - off-page-seo
      - mkt-seo-keyword
      - mkt-seo-geo
    primary_skills:
      - seo-lead
      - technical-seo
      - on-page-seo
      - off-page-seo
      - mkt-seo-keyword
      - mkt-seo-geo
    phase_end_gate_agent: null
    notes: SEO OS sub-department under CMO — PRJ-GRO-MKOS-001; seo-lead entry

  engineering_os:
    path_prefixes:
      - .cursor/brain/founder-os-memory/projects/
      - .cursor/skills/engineering-cto/
      - .cursor/skills/eng-performance/
      - .cursor/skills/eng-documentation/
      - AI-BOS/.cursor/skills/engineering-cto/
      - AI-BOS/.cursor/skills/eng-performance/
      - AI-BOS/.cursor/skills/eng-documentation/
    brain: .cursor/brain/founder-os-brain.md
    ledger: AI-BOS/tasks.md
    memory: .cursor/brain/founder-os-memory/projects/<slug>/engineering/
    primary_agents:
      - engineering-cto
      - senior-saas-developer
      - frontend-architect
      - nextjs-migration-architect
      - eng-performance
      - eng-documentation
    primary_skills:
      - engineering-cto
      - senior-saas-developer
      - frontend-architect
      - nextjs-migration-architect
      - eng-performance
      - eng-documentation
    phase_end_gate_agent: null
    notes: Engineering OS department under Founder — PRJ-ENG-SAASOS-001; engineering-cto entry; peer to marketing_os

  web_saas:
    path_prefixes:
      - web/
    brain: memories/repo/site-brain.md
    ledger: DOC/PROJECT PLAN/Tasks/tasks.md
    ledger_ai: DOC/PROJECT PLAN/Tasks/ai-context.yaml
    routing_root: DOC/PROJECT PLAN/ai-context.yaml
    primary_agents:
      - senior-saas-developer
      - senior-frontend-specialist
      - Technical_SEO_expert
      - On_Page_SEO_expert
      - Off_Page_SEO_expert
    primary_skills:
      - senior-saas-developer
      - senior-frontend-specialist
      - clerk-nextjs-auth
      - technical-seo
      - on-page-seo
      - off-page-seo
    phase_end_gate_agent: frontend-quality-enforcer
    verify_command: npm run health:check
    verify_cwd: web/
    pre_push_verify_command: npm run ci:check --prefix web
    pre_push_verify_cwd: .
    ci_workflow: .github/workflows/ci.yml

  html_templates:
    path_prefixes:
      - sites/
    brain: .cursor/brain/template-brain.md
    ledger: .cursor/execution/template-tasks.md
    primary_agents:
      - frontend-architect
      - design-system-architect
      - frontend-content-strategist
      - Technical_SEO_expert
      - On_Page_SEO_expert
      - Off_Page_SEO_expert
    primary_skills:
      - html-website-builder
      - frontend-content-strategist
      - technical-seo
      - on-page-seo
      - off-page-seo
    phase_end_gate_agent: frontend-quality-enforcer
    verify_skill: .cursor/skills/html-website-builder/SKILL.md
    commands:
      - /new-site
      - /new-site-phase2

  nextjs_migrations:
    path_prefixes:
      - Frontend_Nextjs/
    brain: .cursor/brain/migration-brain.md
    ledger: .cursor/execution/template-tasks.md
    primary_agents:
      - nextjs-migration-architect
      - senior-frontend-specialist
      - tailwind-design-system-architect
      - Technical_SEO_expert
      - On_Page_SEO_expert
      - Off_Page_SEO_expert
    primary_skills:
      - nextjs-site-migrator
      - senior-frontend-specialist
      - technical-seo
      - on-page-seo
      - off-page-seo
    phase_end_gate_agent: frontend-quality-enforcer
    verify_command: pnpm build
    commands:
      - /migrate-to-next
      - /parity-pass

  conversion:
    path_prefixes:
      - scripts/conversion/
    brain: .cursor/brain/migration-brain.md
    ledger: .cursor/execution/template-tasks.md
    scope_template: .cursor/brain/conversion-scope.template.json
    primary_agents:
      - frontend-system-architect
    primary_skills:
      - frontend-ui-converter
    phase_end_gate_agent: frontend-quality-enforcer
    commands:
      - /convert-ui

  backend_platform:
    path_prefixes:
      - web/src/server/
      - web/src/app/api/
    brain: .cursor/brain/backend-brain.md
    ledger: DOC/PROJECT PLAN/Tasks/tasks.md
    ledger_ai: DOC/PROJECT PLAN/Tasks/ai-context.yaml
    routing_roots:
      - DOC/PROJECT PLAN/Backend/ai-context.yaml
      - DOC/PROJECT PLAN/API and Data/ai-context.yaml
    primary_agents:
      - senior-backend-devops-developer
      - api-contract-architect
      - integration-platform-engineer
    primary_skills:
      - senior-backend-devops-developer
      - api-contract-architect
      - integration-platform
      - clerk-nextjs-auth
    phase_end_gate_agent: backend-quality-enforcer
    verify_command: npm run health:check
    verify_cwd: web/
    commands:
      - /backend-factory
      - /phase-gate-backend
      - /integration-plan
      - /resume-backend-brain

  devops_release:
    path_prefixes:
      - web/.github/
      - studio/
      - DOC/PROJECT PLAN/DevOps/
    brain: .cursor/brain/devops-brain.md
    ledger: DOC/PROJECT PLAN/Tasks/tasks.md
    routing_root: DOC/PROJECT PLAN/DevOps/ai-context.yaml
    primary_agents:
      - devops-release-engineer
    primary_skills:
      - devops-release-engineer
    phase_end_gate_agent: backend-quality-enforcer
    commands:
      - /backend-factory
      - /resume-backend-brain

  agent_system:
    path_prefixes:
      - .cursor/agents/
      - .cursor/skills/
      - .cursor/rules/
      - .cursor/brain/
      - .cursor/commands/
    brain: .cursor/brain/lane-router.yaml
    ledger: tasks.md
    primary_skills:
      - system-builder
    phase_end_gate_agent: null

  blueprints:
    path_prefixes:
      - blueprints/
    brain: .cursor/brain/template-brain.md
    ledger: .cursor/execution/template-tasks.md
    primary_agents:
      - bp-director
    primary_skills:
      - website-blueprint-factory
    phase_end_gate_agent: null

frontend_production_factory:
  description: Agency-grade frontend agents for SaaS and migration work
  agents:
    - senior-saas-developer
    - senior-frontend-specialist
    - frontend-system-architect
    - frontend-content-strategist
    - frontend-quality-enforcer
  commands:
    - /frontend-factory
    - /convert-ui
    - /phase-gate
    - /pre-push-check
    - /resume-brain

backend_devops_factory:
  description: Backend API, integrations, and DevOps release factory for web/ monolith
  agents:
    - senior-backend-devops-developer
    - api-contract-architect
    - integration-platform-engineer
    - devops-release-engineer
    - backend-quality-enforcer
  commands:
    - /backend-factory
    - /phase-gate-backend
    - /integration-plan
    - /resume-backend-brain

