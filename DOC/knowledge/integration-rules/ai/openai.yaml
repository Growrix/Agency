integration: openrouter
category: ai
role: concierge
playbook: AI-BOS/.cursor/skills/integration-platform/references/openai.md
env_source: web/src/server/config/runtime.ts

env_vars:
  - name: OPENROUTER_API_KEY
    required: true
    scope: server
  - name: OPENROUTER_MODEL
    required: false
    scope: server
    default: mistralai/mistral-nemo
  - name: OPENROUTER_BASE_URL
    required: false
    scope: server
    default: https://openrouter.ai/api/v1
  - name: OPENAI_API_KEY
    required: false
    scope: server
    notes: Legacy fallback only
  - name: OPENAI_MODEL
    required: false
    scope: server
    notes: Legacy fallback only

routes:
  - POST /api/v1/ai-concierge
  - /api/v1/ai-concierge/[sessionId]

owner_skill: integration-platform
