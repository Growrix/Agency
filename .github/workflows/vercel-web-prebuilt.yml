name: Vercel Web Prebuilt Deploy

# Tier 2 fallback when Vercel Git Integration finalizer fails on rootDirectory=web.
# Primary production path remains Vercel Git Integration (Tier 1).
# Enable Tier 2 only after secrets exist + repo variable VERCEL_PREBUILT_ENABLED=true.
# Required secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID (growrix project).

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - Desktop_version
    paths:
      - "web/**"
      - ".github/workflows/vercel-web-prebuilt.yml"

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Report Tier 2 prebuilt gate
        run: |
          ENABLED="${{ vars.VERCEL_PREBUILT_ENABLED }}"
          if [ "$ENABLED" = "true" ]; then
            echo "VERCEL_PREBUILT_ENABLED=true — deploy job will run."
          else
            echo "::notice title=Tier 2 prebuilt intentionally skipped::Set repository variable VERCEL_PREBUILT_ENABLED=true after adding secrets VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID. Primary production deploy is Vercel Git Integration (not this workflow). CI success is tracked by the separate CI workflow."
            echo "Current vars.VERCEL_PREBUILT_ENABLED='${ENABLED}' (expected 'true' to deploy)."
          fi

  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    # Set repository variable VERCEL_PREBUILT_ENABLED=true after adding GitHub secrets.
    if: vars.VERCEL_PREBUILT_ENABLED == 'true'
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Run CI check bundle
        run: npm run ci:check
        env:
          CI: true

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build prebuilt output
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt archive
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            vercel deploy --prebuilt --archive=tgz --target=production --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel deploy --prebuilt --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}
          fi
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
